# опис налаштувань контейнерів(сервіси)
services:
  # назва сервісу 1
  rand-num1:
    # як створити образ
    image: rand-num  # назва образу
    build: .        # папка з Dockerfile

    # налаштування
    environment:
      START_RANGE: 10
      END_RANGE: 20

    # читання .env
    env_file:
      - .env

  # сервіс 2
  rand-num2:
    # як створити образ
    image: rand-num  # назва образу(якщо існує то заново не створюється)
    build: .        # папка з Dockerfile

    # налаштування
    environment:
      START_RANGE: -100
      END_RANGE: -50

    # читання .env
    env_file:
      - .env

  rand-num3:
    # як створити образ
    image: rand-num  # назва образу
    build: .        # папка з Dockerfile

    # налаштування
    environment:
      START_RANGE: 1000
      END_RANGE: 2000

    # читання .env
    env_file:
      - .env
